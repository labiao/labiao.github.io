locale: "en-US"
title: "Daoyuan Zheng"
title_separator: "-"
name: "Daoyuan Zheng"
description: "Academic homepage of Daoyuan Zheng"
url: "https://labiao.github.io"
baseurl: ""
repository: "labiao/labiao.github.io"
remote_theme: "academicpages/academicpages.github.io"

author:
  avatar: "profile.jpg"
  name: "Daoyuan Zheng"
  bio: "PhD Candidate in Photogrammetry and Remote Sensing"
  location: "Wuhan, China"
  employer: "Wuhan University"
  email: "zhengdaoyuan@whu.edu.cn"
  googlescholar: "https://scholar.google.com/citations?user=CpwAb0wAAAAJ&hl=en"
  github: "labiao"

include:
  - _pages

collections:
  publications:
    output: true
    permalink: /publication/:path/
  talks:
    output: true
    permalink: /talks/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

timezone: Asia/Shanghai
future: true
read_more: "disabled"
atom_feed:
  hide: true